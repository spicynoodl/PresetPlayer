name: Build unsigned IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          if [ -f project.yml ]; then echo "APP_DIR=." >> $GITHUB_ENV
          elif [ -f PresetPlayer/project.yml ]; then echo "APP_DIR=PresetPlayer" >> $GITHUB_ENV
          else echo "project.yml not found"; ls -R . | head -50; exit 1; fi
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen generate
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild -project PresetPlayer.xcodeproj -scheme PresetPlayer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PresetPlayer.app Payload/
          zip -r PresetPlayer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PresetPlayer-ipa
          path: ${{ env.APP_DIR }}/PresetPlayer.ipa
